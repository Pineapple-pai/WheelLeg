lin_vel_curriculum_end: [-0.14, 0.14]
lin_vel_range: [-0.14, 0.14]
command_min_move_speed: 0.03
command_active_vx: 0.020
command_zero_prob: 0.05

command_balance_gain: 0.08
command_balance_limit: 0.04
command_balance_sign: -1.0
command_balance_from_velocity_error: false

reward_stand_weight: 46.0
reward_upright_weight: 50.0
