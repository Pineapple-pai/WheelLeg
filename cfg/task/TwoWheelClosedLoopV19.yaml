defaults:
  - TwoWheelClosedLoopV18
  - _self_

name: TwoWheelClosedLoop
train_stage: joint_locomotion_dense_v19

# V18 reduced wheel saturation but still used too much roll to get motion.
# V19 is a low-speed straight-line consolidation run: keep posture tight first,
# then let the policy learn useful common wheel motion inside that envelope.
