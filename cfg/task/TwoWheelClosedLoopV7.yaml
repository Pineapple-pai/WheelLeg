defaults:
  - TwoWheelClosedLoopV6
  - _self_

name: TwoWheelClosedLoop
train_stage: joint_locomotion_dense_v7

# V6 learned to move, but by ~17M frames the command envelope and disturbance
# curriculum were already too difficult: episode length dropped below 900 and
# velocity error stayed near the command magnitude. V7 keeps joint training
# active, but holds the robot longer in the learnable slow/mid-speed band.
command_curriculum_end_frame: 42000000
lin_vel_curriculum_start: [-0.06, 0.06]
lin_vel_curriculum_end: [-0.45, 0.45]
lin_vel_range: [-0.45, 0.45]
command_min_move_speed: 0.03
yaw_rate_curriculum_start: 0.06
yaw_rate_curriculum_end: 0.30
max_command_yaw_rate: 0.30

# Keep the distribution broad, but reserve a little more batch mass for stable
# zero-command standing so the shared policy does not forget the base behavior.
command_zero_prob: 0.30
command_yaw_only_prob: 0.10
command_mixed_prob: 0.10

# Release position hold early, but make disturbance and leg exploration lag
# behind wheel locomotion until stand_reward is no longer being sacrificed.
translation_position_hold_release_end_frame: 400000
disturbance_curriculum_start_frame: 18000000
disturbance_curriculum_end_frame: 52000000
leg_policy_curriculum_end_frame: 52000000
leg_policy_scale_start: 0.005
leg_policy_scale_end: 0.80

# Rebalance dense rewards after V6: more posture/height safety, less incentive
# to accept a large tracking error just because direction is roughly correct.
reward_stand_weight: 36.0
reward_upright_weight: 34.0
reward_height_weight: 45.0
reward_settle_weight: 12.0
penalty_roll_weight: 260.0
penalty_roll_rate_weight: 10.0
penalty_pitch_rate_weight: 5.0
reward_velocity_weight: 8.0
reward_direction_weight: 1.2
reward_forward_progress_weight: 3.0
reward_displacement_progress_weight: 1.5
reward_tracking_lin_vel_weight: 10.0
reward_tracking_lin_vel_enhance_weight: 5.0
reward_tracking_lin_vel_pbrs_weight: 4.0
reward_velocity_progress_weight: 35.0
reward_wheel_command_tracking_weight: 2.0
tracking_sigma: 0.030
wheel_command_tracking_sigma: 0.025

robot:
  action_smoothing: 0.50
  action_rate_limit: 0.30
  action_accel_limit: 0.20
  leg_action_rate_limit: 0.03
