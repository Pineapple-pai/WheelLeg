defaults:
  - TwoWheelClosedLoopV20
  - _self_

name: TwoWheelClosedLoop

# V21 fine-tunes V20 by removing the reward terms that made standing still a
# better local optimum than commanded translation.
reward_height_weight: 5.0
penalty_wheel_delta_weight: 8.0
penalty_wheel_common_delta_weight: 3.0

# Keep enough posture incentive for the V20 stand skill, but avoid overpowering
# the move_gate velocity gradients during commanded motion.
reward_settle_weight: 12.0
penalty_roll_weight: 220.0
penalty_pitch_weight: 330.0
penalty_yaw_weight: 330.0
