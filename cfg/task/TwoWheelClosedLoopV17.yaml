defaults:
  - TwoWheelClosedLoopV16
  - _self_

name: TwoWheelClosedLoop
train_stage: joint_locomotion_dense_v17

# V16 stands well but can satisfy the wheel-command proxy while barely moving.
# V17 restores an explicit forward wheel baseline, keeps the residual small,
# and makes body velocity the dominant objective.
lin_vel_curriculum_start: [-0.06, 0.06]
lin_vel_curriculum_end: [-0.30, 0.30]
lin_vel_range: [-0.30, 0.30]
command_min_move_speed: 0.06
command_active_vx: 0.035
command_zero_prob: 0.02
command_yaw_only_prob: 0.0
command_mixed_prob: 0.0

reward_tracking_lin_vel_weight: 34.0
reward_tracking_lin_vel_soft_weight: 10.0
tracking_soft_sigma: 0.14
reward_tracking_lin_vel_enhance_weight: 10.0
reward_velocity_weight: 16.0
reward_normalized_lin_vel_weight: 48.0
normalized_lin_vel_sigma: 0.07
penalty_active_velocity_error_weight: 10.0
penalty_lin_vel_tracking_square_weight: 6.0
lin_vel_tracking_square_scale: 0.22
reward_forward_progress_weight: 4.0
reward_displacement_progress_weight: 2.0
reward_velocity_progress_weight: 55.0
penalty_forward_deficit_weight: 5.0
penalty_speed_shortfall_weight: 3.0

reward_wheel_command_tracking_weight: 10.0
wheel_command_tracking_sigma: 0.055
wheel_command_tracking_sign: 1.0
reward_command_action_alignment_weight: 8.0

# Keep balance rewards high enough to preserve the stable V16 posture, but stop
# paying so much for pure standing that zero translation remains attractive.
reward_stand_weight: 30.0
reward_upright_weight: 34.0
reward_height_weight: 40.0
reward_settle_weight: 4.0
penalty_roll_weight: 300.0
penalty_roll_rate_weight: 10.0
penalty_position_weight: 3.0

penalty_wheel_delta_weight: 3.0
penalty_wheel_common_delta_weight: 3.0
penalty_wheel_diff_delta_weight: 5.0
penalty_wheel_vel_diff_weight: 12.0
penalty_action_diff_weight: 2.0
penalty_translation_wheel_diff_weight: 36.0
penalty_translation_action_diff_weight: 8.0
penalty_yaw_rate_drift_weight: 12.0
penalty_wheel_action_accel_weight: 0.35
penalty_smoothness_weight: 0.12
penalty_action_accel_weight: 0.03
penalty_policy_wheel_residual_weight: 0.01

wheel_balance_baseline_enabled: true
wheel_balance_track_velocity_command: true
wheel_balance_roll_kp: 12.0
wheel_balance_roll_kd: 2.0
wheel_balance_velocity_kd: 0.08
wheel_balance_velocity_feedback_sign: -1.0
wheel_command_feedforward_gain: 1.8
wheel_residual_curriculum_end_frame: 49152000
wheel_residual_scale_start: 0.10
wheel_residual_scale_end: 0.35

robot:
  action_smoothing: 0.50
  action_rate_limit: 0.45
  action_accel_limit: 0.35
  leg_action_rate_limit: 0.008
