defaults:
  - TwoWheelClosedLoopV34
  - _self_

name: TwoWheelClosedLoop

# V35 proved the robot can stand and move safely, but it settles into a slow,
# conservative gait. V36 changes the learning strategy rather than adding more
# posture pressure: fewer zero-command episodes, earlier high-speed exposure,
# and stronger velocity-follow incentives.

# Reduce the standing-biased command mix so the policy spends more of training
# on sustained translation instead of repeatedly rehearsing stop/stand behavior.
command_zero_prob: 0.10
command_stratified_sampling: true
command_min_move_speed: 0.12

# Bring higher-speed commands into the training distribution earlier.
lin_vel_curriculum_start: [-0.10, 0.10]
lin_vel_curriculum_end: [-1.0, 1.0]
command_curriculum_start_frame: 1500000
command_curriculum_end_frame: 140000000

# Keep the posture gates, but make forward tracking matter a little more when
# commands are active.
tracking_lin_vel_multiplier_end: 1.15
reward_normalized_lin_vel_weight: 4.0
reward_wheel_command_tracking_weight: 10.0
reward_command_action_alignment_weight: 4.0
penalty_active_velocity_error_weight: 0.30

# Preserve the proven support shaping from V34.
reward_leg_recovery_weight: 5.0
reward_posture_recovery_weight: 6.0
reward_leg_support_weight: 4.0
penalty_posture_worsening_weight: 4.0

# Keep the motion smooth enough that the policy does not return to the V32
# busy-leg failure mode.
leg_policy_scale_end: 0.55
penalty_leg_action_weight: 0.08
penalty_leg_action_diff_weight: 2.5
penalty_leg_vel_weight: 0.22
