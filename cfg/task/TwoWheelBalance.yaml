name: TwoWheelBalance

defaults:
  - /base/env_base@_here_
  - /base/sim_base@_here_

env:
  num_envs: 128
  env_spacing: 4
  max_episode_length: 500

robot:
  usd_path: /home/p/下载/WheelLeg/omni_drones/robots/assets/twowheel_uz05/usd/twowheel_uz05.rcrank.usd
  left_wheel_joint: Lwhl
  right_wheel_joint: Rwhl
  leg_joint_names: [LL, Lcal, RL, Rcal]
  max_wheel_velocity: 24.0
  action_smoothing: 0.58
  action_rate_limit: 0.45
  action_accel_limit: 0.0
  wheel_velocity_sign: 1.0
  leg_position_scale: 0.18
  max_leg_velocity: 0.45
  leg_action_smoothing: 0.08
  leg_action_rate_limit: 0.025
  lock_leg_actions: false

  lock_passive_joints: true
  leg_drive_stiffness: 120.0
  leg_drive_damping: 12.0
  leg_drive_max_force: 60.0
  leg_drive_max_velocity: 4.0
  passive_drive_stiffness: 500.0
  passive_drive_damping: 20.0
  passive_drive_max_force: 80.0
  passive_drive_max_velocity: 4.0
ground:
  static_friction: 1.2
  dynamic_friction: 1.0
  restitution: 0.0

time_encoding: true
stats_alpha: 0.8

reset_height: 0.14
min_height: 0.105
max_init_roll: 0.01
max_init_pitch: 0.005
termination_roll: 0.18
termination_pitch: 0.25
max_xy: 5.0

# Deploy-oriented safe-motion setup: keep standing as the dominant task while
# sampling small bidirectional velocity commands. Speed rewards are gated by a
# valid standing posture in the task code.
forward_axis_sign: -1.0
min_command_vx: 0.05
max_command_vx: 0.10
command_vx_sign: 1.0
command_bidirectional: true
command_zero_prob: 0.45
command_active_vx: 0.004
command_pitch_gain: 0.0
command_pitch_limit: 0.0
command_pitch_sign: 1.0
wheel_command_bias: 0.10
wheel_command_bias_sign: 1.0
max_command_yaw_rate: 0.0
eval_command_vx: 0.0
eval_move_command_vx: 0.08
eval_command_yaw_rate: 0.0

reward_alive_weight: 1.0
reward_stand_weight: 30.0
reward_upright_weight: 28.0
reward_height_weight: 40.0
reward_velocity_weight: 2.0
reward_direction_weight: 0.0
reward_forward_progress_weight: 0.0
reward_displacement_progress_weight: 0.0
penalty_forward_deficit_weight: 4.0
penalty_speed_shortfall_weight: 2.0
reward_position_weight: 0.0
reward_yaw_weight: 0.0
reward_yaw_rate_weight: 0.0
reward_settle_weight: 10.0
penalty_fall_weight: 60.0
penalty_roll_weight: 350.0
penalty_roll_rate_weight: 24.0
penalty_pitch_weight: 90.0
penalty_pitch_rate_weight: 10.0
penalty_yaw_weight: 8.0
penalty_yaw_rate_weight: 4.0
penalty_position_weight: 22.0
penalty_lateral_velocity_weight: 12.0
penalty_lin_vel_z_weight: 1.0
penalty_action_diff_weight: 1.20
penalty_wheel_vel_diff_weight: 5.00
penalty_wheel_speed_weight: 0.050
penalty_action_weight: 0.002
penalty_smoothness_weight: 0.45
penalty_action_accel_weight: 0.32
reward_leg_neutral_weight: 0.3
penalty_leg_pos_weight: 0.0
penalty_leg_vel_weight: 0.04
penalty_leg_action_weight: 0.025
penalty_leg_action_diff_weight: 0.18

# Wheel-Legged-Gym style rewards, adapted to this USD/action interface.
wl_tracking_sigma: 0.0010
wl_tracking_ang_sigma: 0.03
wl_height_sigma: 0.001
wl_tracking_lin_vel_weight: 35.0
wl_tracking_lin_vel_enhance_weight: 0.0
wl_tracking_ang_vel_weight: 10.0
wl_base_height_weight: 3.0
wl_orientation_weight: -35.0
wl_lin_vel_z_weight: -2.0
wl_ang_vel_xy_weight: -2.0
wl_dof_vel_weight: -0.02
wl_dof_acc_weight: -0.00000025
wl_action_rate_weight: -0.80
wl_action_smooth_weight: -0.60
wl_nominal_state_weight: -0.20

reward_tracking_lin_vel_weight: 28.0
reward_tracking_lin_vel_enhance_weight: 8.0
reward_tracking_ang_vel_weight: 3.0
reward_tracking_ang_vel_enhance_weight: 3.0
reward_base_height_weight: 1.0
reward_nominal_state_weight: -1.0
reward_lin_vel_z_weight: -1.0
reward_ang_vel_xy_weight: -0.20
reward_orientation_weight: -30.0
reward_dof_vel_weight: -5e-5
reward_dof_acc_weight: -2.5e-7
reward_torques_weight: -0.0001
reward_action_rate_weight: -0.05
reward_action_smooth_weight: -0.05
reward_collision_weight: -5.0
reward_dof_pos_limits_weight: -1.0
tracking_sigma: 0.01
base_height_target: 0.118
height_floor: 0.09
penalty_low_height_weight: 160.0
soft_dof_pos_limit: 0.97
max_contact_force: 20.0
terminate_on_body_contact: false
contact_terminate_force_threshold: 5.0
# Joint order: LL, Lcal, RL, Rcal. Medium-low stand: lower than the high
# standing pose, but high enough that lying on the chassis is no longer valid.
stand_joint_pos: [-0.2, 0.28, -0.2, -0.28]

action_transform: null
