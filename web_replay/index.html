<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UZ-05 PPO 目标回放</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header><div><span class="eyebrow">UZ-05 / MUJOCO</span><h1>PPO 直接目标回放</h1></div><span id="mode" class="badge">PPO DIRECT</span></header>
    <section class="viewport"><img id="frame" alt="MuJoCo frame"></section>
    <section class="toolbar">
      <button id="play">▶ 播放</button><button id="step">单步</button><button id="reset">重置</button>
      <label>速度 <input id="speed" type="range" min="0.1" max="4" step="0.1" value="1"></label>
      <label>Seed <input id="seed" type="number" value="2000"></label>
    </section>
    <section class="grid">
      <article><h2>状态</h2><div class="metrics"><span>步数 <b id="stepValue">0</b></span><span>奖励 <b id="rewardValue">0</b></span><span>终止 <b id="termination">ready</b></span><span>高度 <b id="height">0</b></span><span>俯仰 <b id="pitch">0</b></span><span>前向速度 <b id="vx">0</b></span></div></article>
      <article><h2>PPO 动作目标</h2><div class="metrics"><span>左轮目标 <b id="wheelL">0</b></span><span>右轮目标 <b id="wheelR">0</b></span><span>左轮电流 <b id="currentL">0</b></span><span>右轮电流 <b id="currentR">0</b></span><span>左腿长 <b id="legL">0</b></span><span>右腿长 <b id="legR">0</b></span></div></article>
      <article><h2>手动轮速目标</h2><label>共模轮速 <input id="wheelSpeed" type="range" min="-8" max="8" step="0.1" value="0"><b id="wheelSpeedValue">0</b> rad/s</label><label>偏航目标 <input id="yawRate" type="range" min="-3" max="3" step="0.1" value="0"><b id="yawValue">0</b> rad/s</label></article>
      <article><h2>腿部测量</h2><div>目标 <b id="legTarget">0</b> m</div><div>误差 <b id="legError">0</b> mm</div></article>
    </section>
    <footer>动作顺序：左轮速、右轮速、四个腿关节绝对位置目标；腿由 PD 执行，轮由速度环执行。</footer>
  </main><script src="/app.js"></script>
</body></html>
